<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSM Ostrava 2026 — tabletová úvodka</title>
    <style>
      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        background: #faf9f3;
        color: #101010;
        font-family: Arial, Helvetica, sans-serif;
      }

      .blue-blob,
      .orange-blob {
        position: absolute;
        border-radius: 999px;
      }

      .blue-blob {
        right: -20%;
        top: -10%;
        width: 63%;
        height: 37%;
        background: #0000f4;
        transform: rotate(-13deg);
      }

      .orange-blob {
        left: -28%;
        top: 35%;
        width: 56%;
        height: 35%;
        background: #fd6206;
        transform: rotate(17deg);
      }

      header {
        position: relative;
        z-index: 3;
        padding: 4.2% 5.4% 0;
      }

      .brand-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 3vw;
      }

      .logo {
        display: block;
        width: 42%;
        max-height: 10vh;
        padding: 0.8vw 1.2vw;
        border-radius: 1.5vw;
        background: #faf9f3;
        object-fit: contain;
        object-position: left center;
      }

      .place {
        padding: 1.2vw 1.6vw;
        border: 0.18vw solid #fd6206;
        border-radius: 1.3vw;
        background: rgba(255, 255, 255, 0.94);
        font-size: clamp(13px, 1.85vw, 28px);
        font-weight: 900;
        line-height: 1.15;
        transform: rotate(-3deg);
      }

      h1 {
        width: fit-content;
        max-width: 78%;
        margin: 2.5vh 0 0;
        padding: 0.7vh 1.2vw 0.9vh;
        border-radius: 1.6vw;
        background: rgba(250, 249, 243, 0.96);
        font-size: clamp(38px, 7.2vw, 104px);
        line-height: 0.9;
        letter-spacing: -0.055em;
      }

      h1 span { color: #0000f4; }

      .sub {
        margin: 1.7vh 0 0;
        font-size: clamp(15px, 2.2vw, 31px);
        line-height: 1.2;
      }

      .tablet {
        position: absolute;
        z-index: 4;
        left: 50%;
        top: 31%;
        width: 78%;
        aspect-ratio: 3 / 4;
        padding: 1.1vw;
        overflow: hidden;
        border: 0.25vw solid #77777e;
        border-radius: 4.2vw;
        background: #0b1628;
        box-shadow: 0 2.2vh 3vh rgba(0, 0, 0, 0.26);
        transform: translateX(-48%) perspective(1000px) rotateY(-5deg) rotateZ(1.8deg);
        transform-origin: 50% 10%;
      }

      .tablet img {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 3.2vw;
        object-fit: cover;
        object-position: top center;
      }

      body.google .tablet {
        top: 32%;
        width: 72%;
        aspect-ratio: 9 / 16;
        padding: 1.25vw;
        border-radius: 5vw;
        transform: translateX(-49%) perspective(900px) rotateY(-4deg) rotateZ(-1.4deg);
      }

      body.google .tablet img { border-radius: 3.8vw; }
      body.google .blue-blob { background: #fd6206; }
      body.google .orange-blob { background: #0000f4; }
      body:not(.intro) .place,
      body:not(.intro) .sub { display: none; }
      body:not(.intro) .tablet {
        top: 28%;
        transform: translateX(-50%);
      }
      body.google:not(.intro) .tablet {
        top: 34%;
        width: 64%;
      }

      @media (max-aspect-ratio: 3/5) {
        .logo { width: 58%; }
        .place { font-size: clamp(10px, 3vw, 20px); }
        h1 { max-width: 92%; font-size: clamp(34px, 10.2vw, 72px); }
        .sub { font-size: clamp(13px, 4vw, 24px); }
      }
    </style>
  </head>
  <body class="ipad">
    <div class="blue-blob"></div>
    <div class="orange-blob"></div>
    <header>
      <div class="brand-row">
        <img class="logo" src="csm-logo-program.png" alt="CSM Ostrava 2026" />
        <div class="place">OSTRAVA<br />ČERNÁ LOUKA</div>
      </div>
      <h1 id="headline">Všechno důležité<br /><span>na jednom místě</span></h1>
      <p class="sub">Program, mapa, novinky i vlastní plán</p>
    </header>
    <div class="tablet">
      <img id="screenshot" src="source-tablet-apple/04-program.png" alt="Tabletová aplikace CSM Ostrava" />
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const platform = params.get("platform") === "google" ? "google" : "ipad";
      const kind = params.get("kind") || "intro";
      const headlines = {
        intro: ["Všechno důležité", "na jednom místě"],
        program: ["Celý program", "přehledně podle dnů"],
        map: ["Trasy a místa", "vždy po ruce"],
        myProgram: ["Sestav si", "vlastní program"],
        information: ["Praktické informace", "i důležité kontakty"],
        saturday: ["Naplánuj si", "každý den CSM"],
      };
      const [firstLine, secondLine] = headlines[kind] || headlines.intro;
      document.body.className = `${platform} ${kind}`;
      document.getElementById("headline").innerHTML = `${firstLine}<br><span>${secondLine}</span>`;
      document.getElementById("screenshot").src = params.get("src") || (platform === "google"
        ? "source-tablet-google/01-program.png"
        : "source-tablet-apple/04-program.png");
    </script>
  </body>
</html>
