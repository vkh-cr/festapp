<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSM Ostrava 2026 — store obal</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color: #101010;
        background: #f5f4ed;
      }

      * { box-sizing: border-box; }

      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }

      body {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100%;
        padding: 5.2vh 6.6vw 0;
        background: #f5f4ed;
      }

      .shape { position: absolute; z-index: 0; border-radius: 999px; }
      .shape-blue { top: -9vh; right: -23vw; width: 67vw; height: 36vh; background: #0000f4; transform: rotate(-12deg); }
      .shape-orange { top: 28vh; left: -30vw; width: 62vw; height: 30vh; background: #fd6206; transform: rotate(20deg); }

      header { position: relative; z-index: 2; }

      .logo {
        display: block;
        width: min(56vw, 310px);
        max-height: 10vh;
        padding: 7px 10px;
        border-radius: 16px;
        background: #f5f4ed;
        object-fit: contain;
        object-position: left center;
      }

      h1 {
        max-width: 84vw;
        margin: 3vh 0 0;
        font-size: clamp(34px, 7.7vw, 104px);
        line-height: 0.92;
        letter-spacing: -0.055em;
      }

      .device-stage {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        min-height: 0;
        padding-top: 3.5vh;
      }

      .device {
        position: relative;
        width: min(78vw, 34vh, 690px);
        aspect-ratio: 1179 / 2556;
        transform: rotate(2.2deg) translateY(2.4%);
        filter: drop-shadow(0 2.4vh 2.2vh rgba(0, 0, 0, 0.25));
      }

      .screen {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: white;
      }

      .screen img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }

      body.iphone .device {
        padding: clamp(9px, 1.8vw, 26px);
        border-radius: clamp(38px, 8.5vw, 104px);
        background: #0a0a0b;
        box-shadow: inset 0 0 0 2px #85858b, inset 0 0 0 5px #1f1f23;
      }

      body.iphone .screen { inset: clamp(9px, 1.8vw, 26px); border-radius: clamp(29px, 6.9vw, 83px); }

      .island {
        display: none;
        position: absolute;
        z-index: 4;
        top: clamp(18px, 3.9vw, 48px);
        left: 50%;
        width: 29%;
        height: 1.85%;
        min-height: 16px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #050505;
      }

      body.iphone .island { display: block; }

      body.android .device {
        padding: clamp(6px, 1.2vw, 16px);
        border: clamp(4px, 0.8vw, 10px) solid #111927;
        border-radius: clamp(24px, 5.5vw, 72px);
        background: #111927;
        transform: rotate(-1.4deg) translateY(2.8%);
      }

      body.android .screen { inset: clamp(6px, 1.2vw, 16px); border-radius: clamp(17px, 4.1vw, 54px); }

      body.android .shape-blue { background: #fd6206; }
      body.android .shape-orange { background: #0000f4; }

      @media (min-aspect-ratio: 3/5) {
        body { padding-top: 4vh; }
        h1 { margin-top: 2vh; font-size: clamp(30px, 6.7vw, 86px); }
        .device { width: min(61vw, 34vh, 600px); }
      }
    </style>
  </head>
  <body class="iphone">
    <span class="shape shape-blue"></span>
    <span class="shape shape-orange"></span>
    <header>
      <img class="logo" src="csm-logo-program.png" alt="CSM Ostrava 2026" />
      <h1 id="headline">Program, který žije právě teď</h1>
    </header>
    <main class="device-stage">
      <div class="device" aria-label="Náhled aplikace">
        <div class="screen"><img id="screenshot" src="source/09-program-happening-now.png" alt="Screenshot aplikace CSM" /></div>
        <span class="island"></span>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const platform = params.get("platform") === "android" ? "android" : "iphone";
      const src = params.get("src") || "source/09-program-happening-now.png";
      const sourceTitle = params.get("title") || "Program — právě probíhá";
      const headlineMap = [
        [/mapa|tras/i, "Všechny cesty CSM po ruce"],
        [/můj program/i, "Tvůj program. Tvůj rytmus."],
        [/přednáška|řečník|profil/i, "Inspirace od lidí, kteří mají co říct"],
        [/informace|centrum/i, "Důležité informace vždy po ruce"],
        [/termín/i, "Najdi si svůj čas"],
        [/právě probíhá/i, "Program, který žije právě teď"],
      ];
      document.body.className = platform;
      document.getElementById("screenshot").src = src;
      document.getElementById("headline").textContent = headlineMap.find(([pattern]) => pattern.test(sourceTitle))?.[1] || sourceTitle;
    </script>
  </body>
</html>
