   function getNotificationPermission() {
    // Check if the Notification API is supported
    if (!("Notification" in window)) {
      console.error("This browser does not support desktop notifications.");
      return false;
    }

    // Check if the site is served over HTTPS or is running on localhost
    if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
      console.error("Notifications require a secure context (HTTPS).");
      return false;
    }

    // Return the permission status
    return OneSignal.Notifications.permission;

  async function persistUsedFontResources() {
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) {
      await new Promise(function(resolve) {

      });

    const fontUrls = performance.getEntriesByType('resource')
      .map(function(entry) { return entry.name; })
      .filter(function(resourceUrl) {
        const origin = new URL(resourceUrl).origin;
        return origin === 'https://fonts.googleapis.com' ||
          origin === 'https://fonts.gstatic.com';

    await Promise.allSettled([...new Set(fontUrls)].map(function(resourceUrl) {

      // demand-loaded Noto Color Emoji shards, but no unused font catalog.
      return fetch(resourceUrl, { mode: 'cors', cache: 'force-cache' });
