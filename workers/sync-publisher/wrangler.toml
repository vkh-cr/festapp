name = "festapp-sync-publisher"
main = "src/worker.ts"
compatibility_date = "2026-08-01"
workers_dev = false

[vars]
SUPABASE_URL = "https://lwfpdjxsdmkfyrzqbrlk.supabase.co"
SYNC_ASSET_ORIGIN = "https://assets.festapp.net"
SYNC_SCOPE_IDS = "643"

[[r2_buckets]]
binding = "PUBLIC_SYNC"
bucket_name = "festapp-public"

[triggers]
crons = [ "* * * * *" ]

[observability]
enabled = true
head_sampling_rate = 1

[placement]
mode = "smart"
