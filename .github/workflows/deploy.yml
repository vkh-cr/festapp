name: Deploy

# Conf-driven router. Each prod/* branch declares its target in
# automation/project.conf (DEPLOY_TARGET=cloudflare | netlify | gh-pages).
# Branches without DEPLOY_TARGET (or with DEPLOY_TARGET=skip) are ignored, so
# legacy branches such as prod/festapp keep using their own workflow until
# they opt in.

on:
  push:
    branches:
      - 'prod/*'
  workflow_dispatch:

jobs:
  tenant-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify production branch is a canonical main overlay
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF#refs/heads/}"
          case "$BRANCH" in
            prod/csmostrava2026) TENANT_ID=csmostrava2026 ;;
            prod/hvezdamorska) TENANT_ID=hvezdamorska ;;
            *) echo "No unified-overlay policy for $BRANCH"; exit 0 ;;
          esac
          BASE_MAIN_SHA=$(node -e 'const v=require("./automation/tenant-overlay.json");process.stdout.write(v.baseMainSha||"")')
          test -n "$BASE_MAIN_SHA"
          git fetch --no-tags origin main
          git show "$BASE_MAIN_SHA:automation/check_tenant_branch_drift.sh" > /tmp/check-tenant-drift.sh
          chmod +x /tmp/check-tenant-drift.sh
          CANONICAL_MAIN_REF=origin/main /tmp/check-tenant-drift.sh "$BASE_MAIN_SHA" "$TENANT_ID" "$GITHUB_SHA"
          MAIN_TREE=$(mktemp -d /tmp/festapp-main-policy.XXXXXX)
          rmdir "$MAIN_TREE"
          git worktree add --detach "$MAIN_TREE" "$BASE_MAIN_SHA"
          trap 'git worktree remove --force "$MAIN_TREE"' EXIT
          bash "$MAIN_TREE/automation/tests/tenant_config_matrix.test.sh"
          git worktree remove "$MAIN_TREE"
          trap - EXIT

  detect:
    needs: tenant-drift
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.read.outputs.target }}
      cf_project: ${{ steps.read.outputs.cf_project }}
      branch: ${{ steps.read.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        shell: bash
        run: |
          set -e
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          if [ ! -f automation/project.conf ]; then
            echo "::warning::automation/project.conf missing on ${BRANCH}, skipping deploy."
            echo "target=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Source the conf so quoted values with spaces survive.
          set -a
          # shellcheck disable=SC1091
          source automation/project.conf
          set +a

          TARGET="${DEPLOY_TARGET:-skip}"
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "cf_project=${CLOUDFLARE_PROJECT_NAME:-}" >> "$GITHUB_OUTPUT"

          echo "Resolved DEPLOY_TARGET=${TARGET} on branch ${BRANCH}"

  cloudflare:
    needs: detect
    if: needs.detect.outputs.target == 'cloudflare'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: flutter-version
        name: Read canonical Flutter version
        run: echo "version=$(node automation/flutter_version.mjs)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: 'stable'

      - name: Build (Flutter + Web Client) via shared script
        run: ./automation/cloudflare_build.sh

      - name: Ensure CF production_branch matches current branch
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ needs.detect.outputs.cf_project }}
          BRANCH: ${{ needs.detect.outputs.branch }}
        shell: bash
        run: |
          set -e
          if [ -z "${CF_PROJECT}" ]; then
            echo "::error::CLOUDFLARE_PROJECT_NAME missing in automation/project.conf on branch ${BRANCH}."
            exit 1
          fi
          RESP=$(curl -sS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"production_branch\":\"${BRANCH}\"}")
          echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print('production_branch=', d.get('result',{}).get('production_branch')); sys.exit(0 if d.get('success') else 1)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ needs.detect.outputs.cf_project }} --branch=${{ needs.detect.outputs.branch }}

      - name: Verify coherent release on the production domain
        shell: bash
        run: |
          set -e
          source automation/project.conf
          node automation/verify_web_deployment.mjs "https://${DOMAIN}" "${VERSION}"

  netlify:
    needs: detect
    if: needs.detect.outputs.target == 'netlify'
    runs-on: ubuntu-latest
    steps:
      - name: Not implemented in CI
        run: |
          echo "::warning::Netlify deploys still run manually via automation/netlify_deploy_deno_vars.sh."
          echo "If you want CI-driven Netlify deploys, add a job here that wraps that script."
          exit 0

  gh-pages:
    needs: detect
    if: needs.detect.outputs.target == 'gh-pages'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Not implemented in deploy.yml
        run: |
          echo "::notice::prod/festapp deployment is owned by .github/workflows/web.yml."
          echo "That workflow uses the canonical build_web_bundle.sh builder."
          exit 0

  skipped:
    needs: detect
    if: needs.detect.outputs.target == 'skip' || needs.detect.outputs.target == ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Skipping deploy on ${{ needs.detect.outputs.branch }}: no DEPLOY_TARGET in automation/project.conf."
