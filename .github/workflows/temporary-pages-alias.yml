name: Temporary Pages Alias

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: Tenant receiving its approved temporary festapp.net alias
        required: true
        type: choice
        options:
          - festivalslunovrat
          - farnostopava

jobs:
  alias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the approved alias
        id: target
        env:
          TENANT: ${{ inputs.tenant }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TENANT" in
            festivalslunovrat) echo "alias=slunovrat.festapp.net" >> "$GITHUB_OUTPUT" ;;
            farnostopava) echo "alias=farnostopava.festapp.net" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unapproved tenant alias"; exit 1 ;;
          esac

      - name: Load the production tenant configuration
        env:
          TENANT: ${{ inputs.tenant }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "prod/${TENANT}"
          git show "origin/prod/${TENANT}:automation/project.conf" > "$RUNNER_TEMP/project.conf"

      - name: Create and verify the temporary Cloudflare Pages alias
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: prod/${{ inputs.tenant }}
          TEMPORARY_ALIAS: ${{ steps.target.outputs.alias }}
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/project.conf"
          set +a
          export CF_PROJECT="$CLOUDFLARE_PROJECT_NAME"
          export DOMAIN="$TEMPORARY_ALIAS"
          export CLOUDFLARE_MANAGE_DNS=true
          unset CLOUDFLARE_LEGACY_DNS_TYPE CLOUDFLARE_LEGACY_DNS_TARGET
          node automation/cloudflare/ensure-pages-project.mjs
          node automation/verify_web_deployment.mjs \
            "https://${TEMPORARY_ALIAS}" "$VERSION" "$RUNNER_TEMP/project.conf" \
            "https://${TEMPORARY_ALIAS}"
