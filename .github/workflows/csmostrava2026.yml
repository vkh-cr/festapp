name: Deploy csmostrava2026 to Cloudflare Pages

on:
  push:
    branches: [ prod/csmostrava2026 ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'

      - name: Build (Flutter + Web Client) via shared script
        run: ./automation/cloudflare_build.sh

      - name: Ensure production branch is prod/csmostrava2026
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          RESP=$(curl -sS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/csmostrava2026" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"production_branch":"prod/csmostrava2026"}')
          echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print('production_branch=', d.get('result',{}).get('production_branch')); sys.exit(0 if d.get('success') else 1)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=csmostrava2026 --branch=prod/csmostrava2026
