name: Gh-Pages

on:
  push:
    branches: [ prod/festapp ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read canonical Flutter version
        id: flutter-version
        run: echo "version=$(node automation/flutter_version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: 'stable'

      - name: Build canonical web bundle
        run: bash automation/build_web_bundle.sh static

      - name: Setup SPA Fallback
        # Copy the new index.html (Web Client) to 404.html for GitHub Pages routing
        run: cp build/web/index.html build/web/404.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          cname: live.festapp.net
