[build]
  command = "test -f retirement/netlify-retire-worker.js"
  publish = "retirement"

[[redirects]]
  from = "https://vstupenka.online/festapp_service_worker.js"
  to = "/netlify-retire-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "https://vstupenka.online/flutter_service_worker.js"
  to = "/netlify-retire-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "https://vstupenka.online/push/*"
  to = "/netlify-retire-worker.js"
  status = 200
  force = true

[[redirects]]
  from = "https://vstupenka.online/*"
  to = "https://vstupenky.online/:splat"
  status = 301
  force = true

[[headers]]
  for = "/netlify-retire-worker.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Content-Type = "application/javascript; charset=utf-8"
